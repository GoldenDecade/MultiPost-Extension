name: Sync upstream

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间每天凌晨 02:00 运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: leaperone/MultiPost-Extension
          source_branch: main
          destination_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
